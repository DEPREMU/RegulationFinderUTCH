name: Python checks

on: 
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ production ]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv run --frozen regulation-finder validate
      - run: uv run --frozen regulation-finder train
      - run: uv run --frozen regulation-finder search 'library books return receipt'
      - run: uv run --frozen regulation-finder evaluate
